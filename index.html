<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WatchNest</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <script
      src="https://kit.fontawesome.com/b214036e26.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <header>
      <img src="assets/LOGO.png" alt="" />
      <div class="search-container">
        <div class="search-box">
          <input type="text" placeholder="Search movie.." />
          <button><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
      </div>
    </header>

    <nav>
      <button id="popular">Popular</button>
      <button id="upcoming">Upcoming</button>
      <li>
        <a href="#genre" class="dropdown" id="genre-btn"
          >Genre <i class="fa-solid fa-chevron-down"></i
        ></a>
        <ul class="dropdown-menu" id="genre-menu">
          <li><button class="genre-link" data-id="28">Action</button></li>
          <li><button class="genre-link" data-id="35">Comedy</button></li>
          <li><button class="genre-link" data-id="18">Drama</button></li>
          <li><button class="genre-link" data-id="27">Horror</button></li>
        </ul>
      </li>
    </nav>

    <section class="movies" id="movies">
      <div class="card" id="card"></div>
    </section>

    <script src="script.js"></script>
  </body>
</html>
